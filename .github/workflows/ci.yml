name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs the whole suite against a real local Supabase stack (Postgres, Auth, REST, mail
# catcher), so the isolation tests exercise actual Row Level Security, not mocks.
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies migrations)
        run: supabase start -x storage-api,imgproxy,realtime,edge-runtime,logflare,vector,studio,postgres-meta,supavisor

      - name: Write .env.local from the local stack
        run: pnpm run env:local

      - run: pnpm run lint

      - run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and isolation tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
